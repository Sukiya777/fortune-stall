
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>问心处</title>
<style>
/* ============================================================
   问心处 fortune-stall · 前端(开源独立版)
   铁律「卦面即印章」: 本页只呈现服务端返回的卦面并播动画,
   绝不自己抽牌摇骰。星幕(Starfield)是独立模块, 可整体拷走复用。
   https://github.com/wave2234/fortune-stall
   ============================================================ */
:root{
  --sky0:#07090f; --sky1:#10131d; --ink:#141412; --shop:#1c1c22; --shop2:#232330;
  --paper:#F4F3EF; --muted:#8a857c; --dim:#5c5952;
  --lantern:#d9a441; --ember:#c96442; --jade:#8fae9a; --wind:#9db4c9;
  --line:rgba(255,255,255,.08); --gold-line:rgba(217,164,65,.32);
  --serif:"Anthropic Serif","Tiempos Text","Source Serif 4","Lora",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Segoe UI",Roboto,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:linear-gradient(180deg,var(--sky0) 0%,var(--sky1) 62%,var(--ink) 100%);
  color:var(--paper);font-family:var(--sans);min-height:100%}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font-family:inherit;color:var(--paper);background:rgba(255,255,255,.05);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;width:100%}
textarea{resize:vertical;min-height:64px;line-height:1.6}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid rgba(217,164,65,.55);outline-offset:1px;border-radius:10px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat}

#sky{position:fixed;inset:0;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1}
.view{display:none;min-height:100dvh;padding-bottom:96px}
.view.on{display:block}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 0}
.back{color:var(--muted);font-size:14px;padding:6px 10px 6px 4px}
.back:active{opacity:.5}

/* ── 摊面 ── */
.hero{text-align:center;padding:40px 20px 26px}
.hero .eyebrow{font-size:11px;letter-spacing:.55em;color:var(--muted);padding-left:.55em}
.hero h1{font:400 44px/1.2 var(--serif);letter-spacing:.12em;margin:14px 0 10px;padding-left:.12em}
.hero .sub{font-size:12.5px;color:var(--muted);letter-spacing:.06em}
.hero .sub .ph{color:var(--dim);border-bottom:1px dashed var(--dim);padding-bottom:1px}

.stalls{padding:6px 16px;display:flex;flex-direction:column;gap:12px;max-width:520px;margin:0 auto}
.stall{position:relative;text-align:left;background:linear-gradient(180deg,rgba(35,35,48,.72),rgba(28,28,34,.72));
  border:1px solid var(--line);border-top:1px solid var(--gold-line);border-radius:16px;padding:16px 18px 15px;
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.stall:active{transform:scale(.985)}
.stall .eyebrow{font-size:10.5px;letter-spacing:.4em;color:var(--lantern)}
.stall h2{font:400 21px/1.3 var(--serif);margin:7px 0 6px;letter-spacing:.05em}
.stall .desc{font-size:12.5px;line-height:1.75;color:var(--muted)}
.stall .go{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:18px}
.substalls{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 16px 0;max-width:520px;margin:0 auto;align-items:stretch}
.substalls .stall{padding:13px 14px 12px;display:flex;flex-direction:column}
.substalls h2{font-size:16.5px}
.substalls .desc{font-size:11.5px;flex:1}

.footnote{text-align:center;color:var(--dim);font-size:11px;padding:26px 20px 10px;letter-spacing:.1em}

/* ── 起卦 ── */
.castwrap{max-width:560px;margin:0 auto;padding:0 16px}
.castwrap h1{font:400 26px/1.3 var(--serif);letter-spacing:.08em;text-align:center;margin:10px 0 4px}
.castwrap .mnote{text-align:center;color:var(--muted);font-size:12px;margin-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px}
.chip{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:7px 14px;position:relative}
.chip.sel{color:var(--paper);border-color:var(--gold-line);background:rgba(217,164,65,.09)}
.chip .rec{position:absolute;top:-7px;right:-4px;font-size:9px;color:var(--ink);background:var(--lantern);
  border-radius:6px;padding:1px 5px;letter-spacing:.05em}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:6px;letter-spacing:.08em}
.frow{display:flex;gap:10px}
.frow .fld{flex:1}
.modetip{font-size:11.5px;color:var(--dim);line-height:1.7;margin:2px 0 14px;text-align:center}
.primary{display:block;width:100%;background:linear-gradient(180deg,rgba(201,100,66,.92),rgba(169,80,52,.92));
  color:var(--paper);border-radius:12px;padding:13px;font-size:15px;letter-spacing:.25em;padding-left:calc(13px + .25em);margin-top:4px}
.primary:disabled{opacity:.35}
.primary:active:not(:disabled){transform:scale(.985)}

/* 仪式台 */
.stage{margin:18px 0 0;min-height:0}
.dicerow{display:flex;gap:16px;justify-content:center;padding:8px 0 2px}
.die{width:62px;height:62px;background:linear-gradient(155deg,#f7f6f2,#ddd9d0);border-radius:13px;
  position:relative;box-shadow:inset 0 -3px 0 rgba(0,0,0,.14),0 4px 14px rgba(0,0,0,.45)}
.die i{position:absolute;width:10px;height:10px;background:#23211e;border-radius:50%;
  left:calc(var(--x)*50% + 12px - var(--x)*12px);top:calc(var(--y)*50% + 12px - var(--y)*12px);transform:translate(-2px,-2px)}
.die.q::after{content:'?';position:absolute;inset:0;display:grid;place-items:center;color:#8a857c;font:400 26px var(--serif)}
.die.rolling{animation:shake .5s infinite}
@keyframes shake{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(2px,-3px) rotate(7deg)}
  50%{transform:translate(-3px,1px) rotate(-6deg)}75%{transform:translate(1px,2px) rotate(4deg)}100%{transform:translate(0,0) rotate(0)}}
.locktag{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;color:var(--lantern);
  font-size:11.5px;letter-spacing:.3em;padding-left:.3em}
.locktag::before,.locktag::after{content:'';height:1px;width:36px;background:var(--gold-line)}

.coincol{display:flex;flex-direction:column-reverse;gap:9px;max-width:340px;margin:6px auto 0}
.tossrow{display:flex;align-items:center;gap:10px;opacity:0;transform:translateY(6px);transition:.45s}
.tossrow.show{opacity:1;transform:none}
.tossrow .yname{width:26px;color:var(--muted);font-size:12px;text-align:center}
.tossrow .coins{display:flex;gap:6px}
/* 方孔铜钱 (coinface-20260810): 外圆内方; 浅黄铜=背(素面), 深铜=字(铸元亨利貞, 上下右左对读) */
.coin{width:36px;height:36px;border-radius:50%;position:relative;flex:none;
  background:radial-gradient(circle at 32% 28%,#ecd08a,#caa25c 45%,#977440 78%,#715428);
  box-shadow:inset 0 1px 1px rgba(255,242,205,.55),inset 0 -2px 3px rgba(35,22,8,.5),
    inset 0 0 0 1px rgba(70,50,22,.55),0 2px 5px rgba(0,0,0,.5)}
.coin::before{content:'';position:absolute;left:50%;top:50%;width:11px;height:11px;transform:translate(-50%,-50%);
  background:#0b0c11;box-shadow:inset 0 1.5px 2px rgba(0,0,0,.95),inset 0 -1px 0 rgba(240,220,170,.22),
    0 1px 0 rgba(255,240,200,.22),0 0 0 1px rgba(0,0,0,.4)}
.coin.zi{background:radial-gradient(circle at 32% 28%,#7d6647,#5a4732 48%,#41321f 80%,#2f2415);
  box-shadow:inset 0 1px 1px rgba(230,205,160,.28),inset 0 -2px 3px rgba(0,0,0,.55),
    inset 0 0 0 1px rgba(22,15,6,.7),0 2px 5px rgba(0,0,0,.5)}
.coin.zi::before{box-shadow:inset 0 1.5px 2px rgba(0,0,0,.95),inset 0 -1px 0 rgba(230,205,160,.15),
    0 1px 0 rgba(230,205,160,.12),0 0 0 1px rgba(0,0,0,.5)}
.coin .ins{position:absolute;inset:0;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);place-items:center;
  font:600 8.5px/1 var(--serif);color:#e6d1a0;text-shadow:0 1px 1px rgba(0,0,0,.65)}
.coin .ins i{font-style:normal}
.coin .ins i:nth-child(1){grid-area:1/2}
.coin .ins i:nth-child(2){grid-area:3/2}
.coin .ins i:nth-child(3){grid-area:2/3}
.coin .ins i:nth-child(4){grid-area:2/1}
.tossrow.show .coin{animation:cflip .5s}
@keyframes cflip{from{transform:rotateY(0)}to{transform:rotateY(720deg)}}
.tossrow .yao{flex:1;text-align:right;font-size:15px;letter-spacing:2px;color:var(--paper);white-space:nowrap}
.tossrow .yao b{color:var(--lantern);font-weight:400;margin-left:6px;font-size:13px}

/* 塔罗 */
.spread{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding:10px 0 4px;--cw:min(27vw,108px)}
.spread.one{--cw:min(44vw,150px)}
.spread.celtic{flex-direction:column;align-items:center;gap:18px;--cw:min(20.5vw,82px)}
.cel-cross{display:grid;grid-template-columns:repeat(3,var(--cw));grid-auto-rows:calc(var(--cw)*1.62);gap:10px;justify-content:center}
.cel-c1{grid-area:2/2;position:relative}
.cel-c2{position:absolute;inset:0;transform:rotate(90deg) scale(.9);z-index:2}
.cel-c3{grid-area:2/1}.cel-c4{grid-area:3/2}.cel-c5{grid-area:1/2}.cel-c6{grid-area:2/3}
.cel-staff{display:grid;grid-template-columns:repeat(4,var(--cw));gap:10px}
.tcard{width:var(--cw);height:calc(var(--cw)*1.62);perspective:900px}
.tc-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.3,.7,.25,1)}
.tcard.flip .tc-inner{transform:rotateY(180deg)}
.tc-back,.tc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:10px;border:1px solid var(--gold-line);overflow:hidden}
.tc-back{background:
  radial-gradient(1px 1px at 18% 22%,rgba(244,243,239,.85),transparent 55%),
  radial-gradient(1px 1px at 72% 14%,rgba(244,243,239,.6),transparent 55%),
  radial-gradient(1.5px 1.5px at 60% 68%,rgba(244,243,239,.7),transparent 55%),
  radial-gradient(1px 1px at 30% 82%,rgba(244,243,239,.5),transparent 55%),
  radial-gradient(1px 1px at 86% 46%,rgba(244,243,239,.65),transparent 55%),
  radial-gradient(1px 1px at 12% 56%,rgba(244,243,239,.4),transparent 55%),
  radial-gradient(circle at 50% 40%,rgba(120,140,200,.16),transparent 58%),
  linear-gradient(160deg,#12162a,#0a0c16 58%,#0e1120)}
.tc-back::after{content:'✦';position:absolute;inset:0;display:grid;place-items:center;
  color:rgba(217,164,65,.55);font-size:calc(var(--cw)*.22)}
.tc-back::before{content:'';position:absolute;inset:7px;border:1px solid rgba(217,164,65,.22);border-radius:6px}
.tc-face{transform:rotateY(180deg);background:linear-gradient(170deg,#191c28,#111420 70%,#141828);display:flex}
.tc-rot{flex:1;position:relative;min-width:0}
.tc-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:9% 6%;text-align:center}
.tc-face.rev .tc-rot{transform:rotate(180deg)}
.tc-top{min-height:1.2em;font:400 calc(var(--cw)*.15) var(--serif);color:var(--lantern);letter-spacing:.12em}
.tc-top.suit{font-size:calc(var(--cw)*.17)}
.tc-en{flex:1;display:grid;place-items:center;font:400 calc(var(--cw)*.125) var(--serif);
  text-transform:uppercase;letter-spacing:.13em;line-height:1.45;color:var(--paper);word-break:normal;overflow-wrap:anywhere}
.tc-en.small{font-size:calc(var(--cw)*.105)}
.tc-bot{font-size:calc(var(--cw)*.098);color:var(--muted);letter-spacing:.05em;line-height:1.5}
.tc-revtag{position:absolute;top:5px;right:6px;font-size:calc(var(--cw)*.1);color:var(--ember);
  border:1px solid rgba(201,100,66,.5);border-radius:5px;padding:0 3px;line-height:1.5}
/* 真牌面 (tarotimg-20260810): 韦特原画占满, 底部渐变字幕; 图挂了自动回落文字牌 */
.tc-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.tc-scrim{position:absolute;left:0;right:0;bottom:0;padding:30px 7% 7%;text-align:center;line-height:1.5;
  font-size:calc(var(--cw)*.1);color:var(--paper);
  background:linear-gradient(180deg,transparent,rgba(8,10,16,.6) 42%,rgba(8,10,16,.92))}
.tc-scrim span{display:block;font-size:calc(var(--cw)*.082);color:#b8b3a8;margin-top:2px}
.tc-face.hasimg .tc-txt{display:none}
.tc-face.hasimg.noimg .tc-txt{display:flex}
.tc-face.hasimg.noimg .tc-img,.tc-face.hasimg.noimg .tc-scrim{display:none}
.spread .poslab{width:100%;text-align:center;color:var(--dim);font-size:11px;letter-spacing:.2em;margin-top:-2px}

/* 结果 */
.result{margin:20px 0 0;border:1px solid var(--gold-line);border-radius:14px;overflow:hidden;
  background:linear-gradient(180deg,rgba(30,28,26,.8),rgba(22,21,20,.85))}
.stamp{padding:12px 14px;border-bottom:1px dashed var(--gold-line);color:var(--lantern);
  font-size:12.5px;line-height:1.7;letter-spacing:.04em}
.facefold{padding:12px 14px}
.facefold .lbl{font-size:10.5px;letter-spacing:.3em;color:var(--muted)}
.facefold .txt{font-size:13px;line-height:1.8;margin-top:8px;white-space:pre-wrap;word-break:break-word;
  max-height:340px;overflow:auto;font-variant-numeric:tabular-nums;transition:max-height .3s}
.facefold.fold .txt{max-height:44px;overflow:hidden}
.facefold .foldtip{color:var(--dim);font-size:11px;margin-top:7px;text-align:right}
.facewarn{margin:0 14px 12px;padding:8px 10px;border:1px solid rgba(201,100,66,.4);border-radius:8px;
  color:var(--ember);font-size:12px;line-height:1.6}
.actrow{display:flex;gap:10px;padding:0 14px 14px}
.act{flex:1;border:1px solid var(--line);border-radius:10px;padding:11px;font-size:13.5px;color:var(--paper);letter-spacing:.08em}
.act.gold{border-color:var(--gold-line);background:rgba(217,164,65,.1)}
.act:active{opacity:.6}

.emptyline{color:var(--dim);font-size:12.5px;line-height:1.8;text-align:center;padding:6px 0}

/* ── 卦账 ── */
.ledgerwrap{max-width:560px;margin:0 auto;padding:0 16px}
.ledgerwrap h1{font:400 26px/1.3 var(--serif);letter-spacing:.08em;text-align:center;margin:10px 0 16px}
.lrow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:13px 6px;border-bottom:1px solid var(--line)}
.lrow:active{background:rgba(255,255,255,.04)}
.mbadge{flex:none;width:30px;height:30px;border:1px solid var(--gold-line);border-radius:8px;display:grid;place-items:center;
  font:400 14px var(--serif);color:var(--lantern)}
.lrow .lq{flex:1;min-width:0}
.lrow .lq .q1{font-size:13.5px;line-height:1.5;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.lrow .lq .q2{font-size:11px;color:var(--dim);margin-top:3px}
.lrow .vmark{flex:none;font-size:11px;color:var(--jade)}
.lrow .arr{flex:none;color:var(--dim)}

/* 卦账详情 sheet */
.sheetmask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:none}
.sheetmask.on{display:block}
.sheet{position:fixed;left:4px;right:4px;bottom:0;z-index:41;height:86dvh;background:#191816;
  border:1px solid var(--line);border-bottom:none;border-radius:20px 20px 0 0;display:flex;flex-direction:column;
  transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.sheet .shead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet .shead .t{font:400 16px var(--serif);letter-spacing:.08em}
.sheet .shead button{color:var(--muted);font-size:20px;padding:2px 8px}
.sheet .sbody{flex:1;overflow:auto;padding:14px 16px 30px;font-size:13px;line-height:1.85;white-space:pre-wrap;word-break:break-word}
.sheet .sbody .sealft{margin-top:14px;padding-top:10px;border-top:1px dashed var(--gold-line);color:var(--lantern);font-size:12px}
.sheet .sbody .verd{margin-top:14px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;color:var(--paper)}
.sheet .sbody .verd .vl{font-size:10.5px;letter-spacing:.3em;color:var(--muted);margin-bottom:6px}


/* 仪式弹层 */
.rmask{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:none;place-items:center;padding:24px}
.rmask.on{display:grid}
.rbox{width:100%;max-width:400px;background:#1c1b19;border:1px solid var(--gold-line);border-radius:16px;padding:20px 18px}
.rbox h3{font:400 18px var(--serif);letter-spacing:.15em;text-align:center;margin-bottom:10px}
.rbox p{font-size:12.5px;color:var(--muted);line-height:1.8;margin-bottom:12px;text-align:center}
.rbox .rbtns{display:flex;gap:10px;margin-top:14px}
.rbox .rbtns button{flex:1;border:1px solid var(--line);border-radius:10px;padding:11px;font-size:13.5px}
.rbox .rbtns .rgo{border-color:var(--gold-line);color:var(--lantern)}
.rbox .rbtns button:active{opacity:.6}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;background:#2b2521;border:1px solid var(--line);
  border-radius:12px;padding:10px 16px;font-size:13px;z-index:99;opacity:0;transition:.25s;pointer-events:none;max-width:82vw}
.toast.on{opacity:1}

/* ── 管理员界面 ── */
.adminwrap{max-width:560px;margin:0 auto;padding:0 16px}
.adminwrap h1{font:400 26px/1.3 var(--serif);letter-spacing:.08em;text-align:center;margin:10px 0 16px}
.adminstats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.statbox{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center}
.statbox .num{font:400 32px/1 var(--serif);color:var(--lantern);margin-bottom:6px}
.statbox .label{font-size:12px;color:var(--muted);letter-spacing:.1em}
.invitebox{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.invitebox h3{font:400 18px var(--serif);letter-spacing:.08em;margin-bottom:12px;color:var(--lantern)}
.inviteitem{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.inviteitem:last-child{border-bottom:none}
.inviteinfo{flex:1}
.invitecode{font-size:15px;color:var(--paper);letter-spacing:.05em;margin-bottom:4px}
.invitemeta{font-size:11px;color:var(--muted)}
.inviteactions{display:flex;gap:8px}
.inviteactions button{padding:6px 12px;border:1px solid var(--line);border-radius:8px;font-size:12px}
.inviteactions .toggle{color:var(--lantern);border-color:var(--gold-line)}
.inviteactions .delete{color:var(--ember)}
.recorditem{padding:12px 0;border-bottom:1px solid var(--line)}
.recorditem:last-child{border-bottom:none}
.recordtime{font-size:11px;color:var(--muted);margin-bottom:4px}
.recordquestion{font-size:13px;color:var(--paper);margin-bottom:4px}
.recordmeta{font-size:11px;color:var(--dim)}

@media (prefers-reduced-motion:reduce){
  .tc-inner{transition:none}
  .die.rolling,.tossrow.show .coin{animation:none}
  .tossrow{transition:none}
}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="wrap">

<!-- ════ 摊面 ════ -->
<div class="view on" id="vStreet">
  <header class="hero">
    <div class="eyebrow">S U K I</div>
    <h1>问心处</h1>
    <p class="sub">Suki的算卦小摊 · <span class="ph">卦面即印章</span></p>
  </header>
  <div class="stalls">
    <button class="stall" onclick="openCast('xiaoliuren')">
      <div class="eyebrow">快 卦</div><h2>小六壬</h2>

<script>
'use strict';
/* ════════════════════ 基础 ════════════════════ */
/* 不含姓名、邮箱等个人信息；仅用于把卦账隔离到当前浏览器。 */
let VISITOR_ID = localStorage.getItem('fortune_visitor_id');
if(!VISITOR_ID){VISITOR_ID=crypto.randomUUID();localStorage.setItem('fortune_visitor_id',VISITOR_ID);}
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const el = h => {const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild;};
function toast(t){const x=$('toast');x.textContent=t;x.classList.add('on');
  clearTimeout(x._t);x._t=setTimeout(()=>x.classList.remove('on'),2600);}
async function api(path,opt={}){
  const hd={'Content-Type':'application/json','X-Fortune-Visitor':VISITOR_ID,...(opt.headers||{})};
  const r=await fetch(path,{...opt,headers:hd});
  return r;}
function getAdminToken(){
  const adminToken = sessionStorage.getItem('admin_token') || '';
  if(!adminToken){
    const pwd = prompt('请输入管理员密码：');
    if(!pwd) return null;
    sessionStorage.setItem('admin_token', pwd);
  }
  return sessionStorage.getItem('admin_token');
}
async function adminApi(path,opt={}){
  let token = getAdminToken();
  if(!token) throw Error('未授权');
  const hd={'Content-Type':'application/json','X-Admin-Token':token,...(opt.headers||{})};
  const r=await fetch(path,{...opt,headers:hd});
  if(r.status===401){
    sessionStorage.removeItem('admin_token');
    const pwd = prompt('管理员密码错误，请重新输入：');
    if(!pwd) throw Error('未授权');
    sessionStorage.setItem('admin_token', pwd);
    hd['X-Admin-Token'] = pwd;
    const r2=await fetch(path,{...opt,headers:hd});
    if(r2.status===401) throw Error('管理员密码错误');
    return r2;
  }
  return r;
}
function go(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));
  $(v).classList.add('on');window.scrollTo(0,0);}
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ════════════════════ 星幕 Starfield ════════════════════
   独立模块, 之后别的玩法可整体拷走: Starfield.mount(canvas) 即用。
   两层星尘缓漂 + 偶发流星; rAF 驱动; 页面隐藏即暂停省电。 */
const Starfield=(function(){
  let cv,cx,W,H,DPR,stars=[],meteors=[],raf=0,running=false,lastMeteor=0,nextGap=0;
  function size(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
    cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);}
  function seed(){stars=[];const n=Math.round(Math.min(140,(W*H)/9500));
    for(let i=0;i<n;i++){const far=Math.random()<.68;
      stars.push({x:Math.random()*W,y:Math.random()*H,r:far?(.4+Math.random()*.7):(.8+Math.random()*1.2),
        v:far?(.006+Math.random()*.012):(.018+Math.random()*.03),
        a:.25+Math.random()*.6,tw:1.5+Math.random()*3.5,ph:Math.random()*7,far});}}
  function spawnMeteor(){const fromTop=Math.random()<.6;
    meteors.push({x:Math.random()*W*.9+W*.05,y:fromTop?-20:Math.random()*H*.3,
      vx:-(2.4+Math.random()*2.6),vy:1.6+Math.random()*1.6,life:0,max:52+Math.random()*30});}
  function frame(t){if(!running)return;
    cx.clearRect(0,0,W,H);
    for(const s of stars){s.x-=s.v;if(s.x<-2){s.x=W+2;s.y=Math.random()*H;}
      const tw=REDUCED?1:(0.72+0.28*Math.sin(t/1000*(6.28/s.tw)+s.ph));
      cx.globalAlpha=s.a*tw;cx.fillStyle=s.far?'#c9cfdd':'#f4f3ef';
      cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.283);cx.fill();}
    cx.globalAlpha=1;
    if(!REDUCED){
      if(t-lastMeteor>nextGap){lastMeteor=t;nextGap=6000+Math.random()*9000;spawnMeteor();}
      for(let i=meteors.length-1;i>=0;i--){const m=meteors[i];m.x+=m.vx;m.y+=m.vy;m.life++;
        const k=1-m.life/m.max;
        if(k<=0||m.x<-40||m.y>H+40){meteors.splice(i,1);continue;}
        const g=cx.createLinearGradient(m.x,m.y,m.x-m.vx*11,m.y-m.vy*11);
        g.addColorStop(0,'rgba(244,243,239,'+(0.85*k)+')');g.addColorStop(1,'rgba(244,243,239,0)');
        cx.strokeStyle=g;cx.lineWidth=1.3;cx.beginPath();cx.moveTo(m.x,m.y);
        cx.lineTo(m.x-m.vx*11,m.y-m.vy*11);cx.stroke();}}
    raf=requestAnimationFrame(frame);}
  function start(){if(running)return;running=true;raf=requestAnimationFrame(frame);}
  function stop(){running=false;cancelAnimationFrame(raf);}
  function mount(canvas){cv=canvas;cx=cv.getContext('2d');size();seed();
    addEventListener('resize',()=>{size();seed();});
    document.addEventListener('visibilitychange',()=>document.hidden?stop():start());
    start();}
  return {mount,start,stop};
})();
Starfield.mount($('sky'));

/* ════════════════════ 三法与起法 ════════════════════ */
const SUIT_SYM={'宝剑':'🜁','圣杯':'🜄','权杖':'🜂','星币':'🜃'};
const ZHI='子丑寅卯辰巳午未申酉戌亥';
const nowZhi=()=>ZHI[(((new Date().getHours())+1)>>1)%12];
const METHODS={
  xiaoliuren:{title:'小六壬 · 快卦',note:'三宫掐指，急事小事立断',
    modes:[
      {id:'time',label:'按时起卦',rec:true,tip:'以此刻时辰掐算——问事当下，卦在当下。',params:[]},
      {id:'lunar',label:'农历起卦',tip:'按农历月日加时辰掐宫。',params:['la','lb','hour']},
      {id:'numbers',label:'报数起卦',tip:'你随口报三个数。数由你出，卦由摊上落印。',params:['na','nb','nc']},
      {id:'dice',label:'掷骰起卦',ritual:'dice',btn:'掷 骰 子',tip:'三枚骰子在摊上摇——落地即锁，一事一卦。',params:[]},
    ],gender:true},
  liuyao:{title:'六爻 · 深卦',note:'纳甲装卦，世应动变慢慢看',
    modes:[
      {id:'time',label:'按时起卦',rec:true,tip:'以此刻年月日时起卦装卦。',params:[]},
      {id:'numbers',label:'报数起卦',tip:'报三个数：下卦、上卦、动爻。',params:['ya','yb','yc']},
      {id:'coin',label:'摇铜钱',ritual:'coin',btn:'摇 铜 钱',tip:'三枚铜钱摇六次，一爻一爻自下而上。',params:[]},
    ]},
  tarot:{title:'塔罗 · 心镜',note:'牌背是同一片星空',
    modes:[
      {id:'one',label:'单牌',tip:'一张牌，照当下最要紧的那件事。',params:[]},
      {id:'three',label:'三牌阵',rec:true,tip:'过去 · 现在 · 未来，一条时间线。',params:[]},
      {id:'celtic',label:'凯尔特十字',tip:'十张牌的大阵，按位次逐张翻。',params:[]},
      {id:'custom',label:'自定张数',tip:'自己定抽几张。',params:['ta']},
      {id:'interpret',label:'自报牌名',btn:'呈 牌 解 读',tip:'你手上抽好的实体牌，报名字来解。逆位写 reversed:牌名，空格分隔。',params:['tname']},
    ]},
};
const PARAM_DEFS={
  la:{label:'农历月',ph:'1-12',type:'number'}, lb:{label:'农历日',ph:'1-30',type:'number'},
  na:{label:'第一数',ph:'随口报',type:'number'}, nb:{label:'第二数',ph:'随口报',type:'number'}, nc:{label:'第三数',ph:'随口报',type:'number'},
  ya:{label:'下卦数',ph:'1-8',type:'number'}, yb:{label:'上卦数',ph:'1-8',type:'number'}, yc:{label:'动爻数',ph:'1-6',type:'number'},
  ta:{label:'张数',ph:'1-12',type:'number'},
};
let curMethod='xiaoliuren', curMode='time', casting=false, lockedRoll=null, lastCast=null;

function openCast(m){curMethod=m;const M=METHODS[m];
  curMode=(M.modes.find(x=>x.rec)||M.modes[0]).id;
  lockedRoll=null;lastCast=null;casting=false;
  $('castTitle').textContent=M.title;$('castNote').textContent=M.note;
  $('qInput').value='';$('stage').innerHTML='';$('resultHolder').innerHTML='';
  renderModes();go('vCast');}
function renderModes(){const M=METHODS[curMethod];
  $('modeChips').innerHTML=M.modes.map(md=>
    '<button class="chip'+(md.id===curMode?' sel':'')+'" onclick="pickMode(\''+md.id+'\')">'+md.label+
    (md.rec?'<span class="rec">荐</span>':'')+'</button>').join('');
  renderParams();}
function pickMode(id){if(casting)return;curMode=id;lockedRoll=null;
  $('stage').innerHTML='';$('resultHolder').innerHTML='';renderModes();}
function renderParams(){const M=METHODS[curMethod];const md=M.modes.find(x=>x.id===curMode);
  let h='';
  const ps=md.params||[];
  if(ps.includes('tname')){
    h+='<div class="fld"><label>牌名（空格分隔，逆位写 reversed:牌名）</label><textarea id="p_tname" placeholder="如: 愚人 reversed:高塔 圣杯十"></textarea></div>';
  }
  const numParams=ps.filter(p=>PARAM_DEFS[p]);
  if(numParams.length){h+='<div class="frow">'+numParams.map(p=>{const d=PARAM_DEFS[p];
    return '<div class="fld"><label>'+d.label+'</label><input id="p_'+p+'" type="number" inputmode="numeric" placeholder="'+d.ph+'"></div>';}).join('')+'</div>';}
  if(ps.includes('hour')){
    h+='<div class="fld"><label>时辰</label><select id="p_hour">'+
      ZHI.split('').map(z=>'<option value="'+z+'"'+(z===nowZhi()?' selected':'')+'>'+z+'时</option>').join('')+'</select></div>';}
  if(M.gender){
    h+='<div class="fld"><label>问者（小六壬贵人分男女，可不注）</label><select id="p_gender">'+
      '<option value="">不注</option><option value="男">男</option><option value="女">女</option></select></div>';}
  $('params').innerHTML=h;
  $('modeTip').textContent=md.tip||'';
  $('castBtn').textContent=md.btn||(curMethod==='tarot'?'抽 牌':'起 卦');
  $('castBtn').disabled=false;}

function num(id){const v=($('p_'+id)||{}).value;return v===''||v==null?null:Number(v);}

/* ── 出手 ── */
async function fire(){
  if(casting)return;
  const inviteCode = ($('inviteCodeInput')||{}).value||'';
  if(!inviteCode){toast('请先输入邀请码');$('inviteCodeInput').focus();return;}
  const q=$('qInput').value.trim();
  if(!q){toast('无事不占——先把事说清');$('qInput').focus();return;}
  const md=METHODS[curMethod].modes.find(x=>x.id===curMode);
  if(md.ritual==='dice'){if(lockedRoll){ritualOpen();return;}return rollDice(q,inviteCode);}
  if(md.ritual==='coin'){if(lockedRoll){ritualOpen();return;}return rollCoin(q,inviteCode);}
  return castDeterministic(q,md,inviteCode);}

async function castDeterministic(q,md,inviteCode){
  const body={question:q,method:curMethod,mode:curMode};
  if(curMode==='lunar'){body.a=num('la');body.b=num('lb');body.hour=($('p_hour')||{}).value;
    if(body.a==null||body.b==null){toast('农历月日要填全');return;}}
  if(curMode==='numbers'&&curMethod==='xiaoliuren'){body.a=num('na');body.b=num('nb');body.c=num('nc');
    if(body.a==null||body.b==null||body.c==null){toast('三个数报齐');return;}}
  if(curMode==='numbers'&&curMethod==='liuyao'){body.a=num('ya');body.b=num('yb');body.c=num('yc');
    if(body.a==null||body.b==null||body.c==null){toast('下卦、上卦、动爻三个数报齐');return;}}
  if(curMode==='custom'){body.a=num('ta');if(!body.a){toast('先定张数');return;}}
  if(curMode==='interpret'){body.name=($('p_tname')||{}).value.trim();
    if(!body.name){toast('先把牌名报上');return;}}
  if(METHODS[curMethod].gender){const g=($('p_gender')||{}).value;if(g)body.gender=g;}
  setCasting(true,'落印中…');
  try{
    const r=await api('/api/fortune/cast',{method:'POST',body:JSON.stringify(body)});
    const d=await r.json();
    if(!r.ok)throw Error(d.detail||'起卦失败');
    onFace(d.text,null);
    const sid=(d.text.match(/#(\d+)/)||[])[1];
    if(sid){
      try{
        await api('/api/fortune/use_invite',{method:'POST',body:JSON.stringify({code:inviteCode,session_id:parseInt(sid)})});
      }catch(e){console.warn('记录邀请码使用失败',e);}
    }
  }catch(e){toast(e.message||'起卦失败');}
  finally{setCasting(false);}}

function setCasting(on,label){casting=on;const b=$('castBtn');
  b.disabled=on;
  if(on&&label){b.dataset.old=b.textContent;b.textContent=label;}
  else if(!on){
    if(lockedRoll)b.textContent='已 落 印 · 点此依仪重摇';
    else if(b.dataset.old){b.textContent=b.dataset.old;delete b.dataset.old;}}}

/* ── 骰子仪式 ── */
const PIP_XY={1:[[1,1]],2:[[0,0],[2,2]],3:[[0,0],[1,1],[2,2]],4:[[0,0],[0,2],[2,0],[2,2]],
  5:[[0,0],[0,2],[1,1],[2,0],[2,2]],6:[[0,0],[0,2],[1,0],[1,2],[2,0],[2,2]]};
function dieHTML(p){if(!p)return '<div class="die q"></div>';
  return '<div class="die">'+PIP_XY[p].map(([y,x])=>'<i style="--x:'+x+';--y:'+y+'"></i>').join('')+'</div>';}
async function rollDice(q,inviteCode){
  setCasting(true,'骰 子 摇 着 …');
  $('resultHolder').innerHTML='';
  $('stage').innerHTML='<div class="dicerow">'+dieHTML()+dieHTML()+dieHTML()+'</div>';
  $('stage').querySelectorAll('.die').forEach(d=>d.classList.add('rolling'));
  const t0=Date.now();
  try{
    const body={kind:'dice',question:q};
    const g=($('p_gender')||{}).value;if(g)body.gender=g;
    const r=await api('/api/fortune/roll',{method:'POST',body:JSON.stringify(body)});
    const d=await r.json();
    if(!r.ok)throw Error(d.detail||'掷骰失败');
    await sleep(Math.max(0,1100-(Date.now()-t0)));
    $('stage').innerHTML='<div class="dicerow">'+d.pips.map(dieHTML).join('')+'</div>'+
      '<div class="locktag">落 地 即 锁 · 一 事 一 卦</div>';
    lockedRoll={kind:'dice',q};
    onFace(d.text,{pips:d.pips});
    const sid=(d.text.match(/#(\d+)/)||[])[1];
    if(sid){
      try{
        await api('/api/fortune/use_invite',{method:'POST',body:JSON.stringify({code:inviteCode,session_id:parseInt(sid)})});
      }catch(e){console.warn('记录邀请码使用失败',e);}
    }
  }catch(e){$('stage').innerHTML='';toast(e.message||'掷骰失败');}
  finally{setCasting(false);}}

/* ── 铜钱仪式 ── */
const YAO_NAME=['初','二','三','四','五','上'];
function yaoGlyph(y){if(y===9)return '━━━<b>○ 动</b>';if(y===7)return '━━━';
  if(y===8)return '━&nbsp;━';return '━&nbsp;━<b>× 动</b>';}
async function rollCoin(q,inviteCode){
  setCasting(true,'铜 钱 摇 着 …');
  $('resultHolder').innerHTML='';$('stage').innerHTML='';
  try{
    const r=await api('/api/fortune/roll',{method:'POST',body:JSON.stringify({kind:'coin',question:q})});
    const d=await r.json();
    if(!r.ok)throw Error(d.detail||'摇钱失败');
    const col=el('<div class="coincol"></div>');
    $('stage').appendChild(col);
    for(let i=0;i<6;i++){
      const backs=d.tosses[i], yao=d.yaos[i];
      let coins='';
      for(let c=0;c<3;c++)coins+='<span class="coin'+(c<backs?'':' zi')+'" title="'+(c<backs?'背':'字')+'">'+
        (c<backs?'':'<span class="ins"><i>元</i><i>亨</i><i>利</i><i>貞</i></span>')+'</span>';
      const row=el('<div class="tossrow"><span class="yname">'+YAO_NAME[i]+'爻</span>'+
        '<span class="coins">'+coins+'</span><span class="yao">'+yaoGlyph(yao)+'</span></div>');
      col.appendChild(row);
      await sleep(REDUCED?0:120);row.classList.add('show');
      await sleep(REDUCED?0:430);}
    col.insertAdjacentHTML('afterend','<div class="locktag">六 爻 已 成 · 落 地 即 锁</div>');
    lockedRoll={kind:'coin',q};
    onFace(d.text,{tosses:d.tosses});
    const sid=(d.text.match(/#(\d+)/)||[])[1];
    if(sid){
      try{
        await api('/api/fortune/use_invite',{method:'POST',body:JSON.stringify({code:inviteCode,session_id:parseInt(sid)})});
      }catch(e){console.warn('记录邀请码使用失败',e);}
    }
  }catch(e){toast(e.message||'摇钱失败');}
  finally{setCasting(false);}}

/* ── 重摇之仪 ── */
function ritualOpen(){$('ritualReason').value='';$('ritual').classList.add('on');}
function ritualClose(){$('ritual').classList.remove('on');}
function ritualGo(){
  const reason=$('ritualReason').value.trim();
  if(reason.length<2){toast('缘由要写——这是仪式的一部分');return;}
  ritualClose();
  const q0=(lockedRoll&&lockedRoll.q)||$('qInput').value.trim();
  const kind=lockedRoll&&lockedRoll.kind;
  const q=q0+'〔重摇·'+reason+'〕';
  $('qInput').value=q;lockedRoll=null;
  if(kind==='coin')rollCoin(q);else rollDice(q);}

/* ── 结果呈现 ── */
function onFace(text,extra){

    '<div class="actrow">'+
      '<button class="act" onclick="copyFace()">复制卦面</button>'+

      '<button class="act" onclick="resetCast()">再问一事</button>'+

  setCasting(false);

function resetCast(){lockedRoll=null;lastCast=null;

/* ── 塔罗解析与翻牌 ──
   卦面即印章: 这里只解析服务端文本, 解析不动摇不出牌。解析失败就只显示全文。 */
function parseTarot(text){
  const lines=text.split('\n');const cards=[];
  const posRe=/^──\s*(.+?)\s*──$/;
  const cardRe=/^\s*(.+?)[(（]([^()（）]+)[)）]\s*[\[【](正位|逆位)[\]】]\s*(★?大阿卡纳|小阿卡纳·(\S+))?/;
  for(let i=0;i<lines.length;i++){
    const m=lines[i].trim().match(posRe);if(!m)continue;
    const label=m[1];
    if(/元素分布|相邻牌|互动|^─+$/.test(label))continue;
    for(let j=i+1;j<Math.min(i+3,lines.length);j++){
      const c=lines[j].match(cardRe);if(!c)continue;
      const kind=c[4]||'';
      const major=/大阿卡纳/.test(kind)&&!/小阿卡纳/.test(kind);
      let roman='';
      for(let k=j+1;k<Math.min(j+4,lines.length);k++){
        const r=lines[k].match(/编号[:：]\s*([IVXLC0]+)/);if(r){roman=r[1];break;}
        if(posRe.test(lines[k].trim()))break;}
      cards.push({pos:label.replace(/[(（].*?[)）]/g,'').trim(),
        cn:c[1].trim(),en:c[2].trim(),rev:c[3]==='逆位',major,roman,suit:(c[5]||'').trim()});
      i=j;break;}}
  return cards.length?cards:null;}

/* ── 真牌面映射 (tarotimg-20260810) ──
   罗马数字/英文名 → /static/tarot/*.webp; 对不上或加载失败回落文字牌。 */
const RANK_N={ace:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,page:11,knight:12,queen:13,king:14};
const MAJOR_IDX={'the fool':0,'the magician':1,'the high priestess':2,'the empress':3,'the emperor':4,
  'the hierophant':5,'the lovers':6,'the chariot':7,'strength':8,'the hermit':9,'wheel of fortune':10,
  'justice':11,'the hanged man':12,'death':13,'temperance':14,'the devil':15,'the tower':16,
  'the star':17,'the moon':18,'the sun':19,'judgement':20,'the world':21};
const ROMAN_V={i:1,v:5,x:10,l:50,c:100};
function romanInt(r){r=String(r||'').trim().toLowerCase();
  if(r==='0')return 0;if(!r)return null;let t=0;
  for(let i=0;i<r.length;i++){const v=ROMAN_V[r[i]];if(!v)return null;
    t+=(i+1<r.length&&ROMAN_V[r[i+1]]>v)?-v:v;}
  return t;}
function cardImg(c){
  if(c.major){let n=romanInt(c.roman);
    if(n==null)n=MAJOR_IDX[c.en.trim().toLowerCase()];
    return (n==null||n<0||n>21)?null:'/static/tarot/major'+String(n).padStart(2,'0')+'.webp';}
  const m=c.en.trim().match(/^(Ace|Two|Three|Four|Five|Six|Seven|Eight|Nine|Ten|Page|Knight|Queen|King)\s+of\s+(Cups|Wands|Swords|Pentacles)$/i);
  if(!m)return null;
  return '/static/tarot/'+m[2].toLowerCase()+String(RANK_N[m[1].toLowerCase()]).padStart(2,'0')+'.webp';}
function cardHTML(c,idx){
  const top=c.major?('<div class="tc-top">'+esc(c.roman||'★')+'</div>')
    :('<div class="tc-top suit">'+esc(SUIT_SYM[c.suit]||'✦')+'</div>');
  const enSmall=c.en.length>15?' small':'';
  const img=cardImg(c);
  const txt='<div class="tc-txt">'+top+
        '<div class="tc-en'+enSmall+'">'+esc(c.en)+'</div>'+
        '<div class="tc-bot">'+esc(c.cn)+'<br>'+esc(c.pos)+'</div>'+
      '</div>';
  const art=img?('<img class="tc-img" src="'+img+'" alt="'+esc(c.cn)+'" loading="eager" decoding="async">'+
      '<div class="tc-scrim">'+esc(c.cn)+'<span>'+esc(c.pos)+'</span></div>'):'';
  return '<div class="tcard" data-i="'+idx+'"><div class="tc-inner">'+
    '<div class="tc-back"></div>'+
    '<div class="tc-face'+(img?' hasimg':'')+(c.rev?' rev':'')+'">'+
      '<div class="tc-rot">'+art+txt+'</div>'+(c.rev?'<span class="tc-revtag">逆</span>':'')+
    '</div></div></div>';}

function renderSpread(cards){
  if(cards.length===10){
    const c=cards.map((x,i)=>cardHTML(x,i));
    return '<div class="spread celtic">'+
      '<div class="cel-cross">'+
        '<div class="cel-c1">'+c[0]+'<div class="cel-c2">'+c[1]+'</div></div>'+
        '<div class="cel-c3">'+c[2]+'</div><div class="cel-c4">'+c[3]+'</div>'+
        '<div class="cel-c5">'+c[4]+'</div><div class="cel-c6">'+c[5]+'</div>'+
      '</div>'+
      '<div class="cel-staff">'+c[6]+c[7]+c[8]+c[9]+'</div>'+
    '</div>';}
  const cls=cards.length===1?'spread one':'spread';
  return '<div class="'+cls+'">'+cards.map((x,i)=>cardHTML(x,i)).join('')+'</div>';}

function runFlips(scope){
  const cards=[...scope.querySelectorAll('.tcard')].sort((a,b)=>+a.dataset.i-+b.dataset.i);
  if(REDUCED){cards.forEach(c=>c.classList.add('flip'));return;}
  let t=420;
  cards.forEach((c,i)=>{
    setTimeout(()=>c.classList.add('flip'),t);
    t+=(cards.length>=10&&i===5)?1150:650;});}

/* ── 复制卦面: 拿去贴给任何 AI/人断卦 ── */
async function copyFace(){
  if(!lastCast){toast('还没有落印的卦');return;}
  const t=lastCast.text;
  try{await navigator.clipboard.writeText(t);toast('卦面已复制——拿去给你的 AI 断吧');}
  catch(_){
    const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);
    ta.select();try{document.execCommand('copy');toast('卦面已复制——拿去给你的 AI 断吧');}
    catch(e){toast('复制失败，请长按卦面全文手动复制');}
    ta.remove();}}

/* ════════════════════ 卦账 ════════════════════ */
const M_BADGE={xiaoliuren:'壬',liuyao:'爻',tarot:'塔'};
function openLedger(){go('vLedger');loadLedger();}
async function loadLedger(){
  const list=$('ledgerList');
  list.innerHTML='<p class="emptyline">翻账中…</p>';
  try{
    const rows=await (await api('/api/fortune/recent?n=30')).json();
    if(!rows.length){list.innerHTML='<p class="emptyline">账上还没落过印。去起第一卦。</p>';return;}
    list.innerHTML='';
    rows.forEach(r=>{
      const b=el('<button class="lrow"><span class="mbadge">'+(M_BADGE[r.method]||'卦')+'</span>'+
        '<span class="lq"><span class="q1">'+esc(r.q||'（无题）')+'</span>'+
        '<span class="q2">#'+r.id+' · '+esc(r.at||'')+' · '+esc(r.mode||'')+'</span></span>'+
        (r.verdict?'<span class="vmark">已断</span>':'')+
        '<span class="arr">›</span></button>');
      b.onclick=()=>openSession(r.id);
      list.appendChild(b);});
  }catch(e){list.innerHTML='<p class="emptyline">账本打不开：'+esc(e.message)+'</p>';}}
async function openSession(id){
  try{
    const d=await (await api('/api/fortune/session/'+id)).json();
    $('ssTitle').textContent='卦局 #'+d.id;
    let h=esc(d.face||'');
    if(d.seal)h+='<div class="sealft">落款 · '+esc(d.seal)+'</div>';
    h+='<div class="verd"><div class="vl">断 语 存 档</div>'+
  '<textarea id="verdIn" style="margin-top:4px;min-height:200px;width:100%" placeholder="把 AI 或你自己的断语记在这里..."></textarea>'+
  '<button class="act gold" style="display:block;width:100%;margin-top:10px" onclick="saveVerdict('+d.id+')">存 断 语</button></div>';
    $('ssBody').innerHTML=h;
    $('verdIn').value=d.verdict||'';
    $('sheetMask').classList.add('on');$('sessionSheet').classList.add('on');
  }catch(e){toast('这一卦翻不开：'+e.message);}}
function closeSheet(){$('sheetMask').classList.remove('on');$('sessionSheet').classList.remove('on');}

async function saveVerdict(id){
  const v=($('verdIn')||{value:''}).value.trim();
  try{
    const r=await api('/api/fortune/verdict',{method:'POST',body:JSON.stringify({id,verdict:v})});
    const d=await r.json();if(!r.ok)throw Error(d.detail||'存不上');
    toast(v?'断语已记档':'断语已清空');loadLedger();
  }catch(e){toast(e.message);}}
   async function aiVerdict(id){
  if(!confirm('确定让 Suki 断卦局 #'+id+' 吗？')) return;
  toast('AI 正在断卦，请稍候…');
  try{
    const r = await api('/api/fortune/ai_verdict', {
      method: 'POST',
      body: JSON.stringify({id: id, auto_save: true})
    });
    const d = await r.json();
    if(!r.ok) throw Error(d.detail || 'AI 断卦失败');
    $('verdIn').value = d.verdict || '';
    toast('AI 断卦完成，已自动存档');
    loadLedger();
  }catch(e){
    toast(e.message || 'AI 断卦失败');
  }
}

function openAdmin(){

}
async function loadAdmin(){
  try{

}
async function loadInvites(){
  try{
    const r=await adminApi('/api/fortune/admin/invites');
    const d=await r.json();
    if(!r.ok)throw Error(d.detail||'加载失败');
    let h='';
    (d.invites||[]).forEach(inv=>{
      h+='<div class="inviteitem"><div class="inviteinfo"><div class="invitecode">'+esc(inv.code)+'</div>'+
        '<div class="invitemeta">所属人：'+esc(inv.owner||'')+' · 已用 '+inv.used_count+'/'+inv.total_limit+' · '+(inv.active?'启用':'禁用')+'</div></div>'+
        '<div class="inviteactions"><button class="toggle" onclick="toggleInvite('+inv.id+','+(!inv.active)+')">'+(inv.active?'禁用':'启用')+'</button>'+
        '<button class="delete" onclick="deleteInvite('+inv.id+')">删除</button></div></div>';
    });
    $('inviteList').innerHTML=h||'<p class="emptyline">暂无邀请码</p>';
  }catch(e){console.warn('加载邀请码失败',e);}
}
async function createInvite(){
  const owner=($('newInviteOwner')||{}).value||'';
  const limit=parseInt(($('newInviteLimit')||{}).value)||10;
  if(!owner){toast('请输入所属人');return;}
  try{
    const r=await adminApi('/api/fortune/admin/invites',{method:'POST',body:JSON.stringify({owner,total_limit:limit})});
    const d=await r.json();
    if(!r.ok)throw Error(d.detail||'创建失败');
    toast('邀请码已生成：'+d.code);
    $('newInviteOwner').value='';$('newInviteLimit').value='';
    loadInvites();
  }catch(e){toast(e.message||'创建失败');}
}
async function toggleInvite(id,active){
  try{
    await adminApi('/api/fortune/admin/invites/'+id,{method:'PATCH',body:JSON.stringify({active})});
    toast(active?'已启用':'已禁用');
    loadInvites();
  }catch(e){toast(e.message||'操作失败');}
}
async function deleteInvite(id){
  if(!confirm('确定删除这个邀请码吗？'))return;
  try{
    await adminApi('/api/fortune/admin/invites/'+id,{method:'DELETE'});
    toast('已删除');
    loadInvites();
  }catch(e){toast(e.message||'删除失败');}
}
async function clearAllRecords(){
  if(!confirm('确定清空所有卦象记录吗？此操作不可恢复！'))return;
  if(!confirm('再次确认：真的要清空所有记录吗？'))return;
  try{
    const r=await adminApi('/api/fortune/admin/clear',{method:'POST'});
    const d=await r.json();
    if(!r.ok)throw Error(d.detail||'清空失败');
    toast('已清空所有记录');
    loadAdmin();
  }catch(e){toast(e.message||'清空失败');}
}
